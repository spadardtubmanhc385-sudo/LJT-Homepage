# Build the personal homepage and publish the generated site on the gh-pages branch.
name: Deploy academic homepage to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Deploy generated site to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
      - name: Verify the published pages
        run: |
          for path in "" "publications/"; do
            url="https://${GITHUB_REPOSITORY_OWNER}.github.io/LJT-Homepage/${path}"
            status="000"
            for attempt in 1 2 3 4 5 6; do
              status=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              if [ "$status" = "200" ]; then
                echo "OK: $url"
                break
              fi
              echo "Attempt ${attempt}: HTTP ${status} for $url"
              sleep 10
            done
            test "$status" = "200"
          done
